<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Link Tamu — Undangen</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#b08d57;--gold-deep:#8f6f3e;--ink:#2b2520;--soft:#6d6357;--line:rgba(176,141,87,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#faf6ef;color:var(--ink);padding:24px 18px 60px;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto}
header{text-align:center;margin-bottom:22px}
.brand{font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold-deep);font-weight:600}
h1{font-family:'Playfair Display',serif;font-size:28px;margin:8px 0 6px}
.sub{font-size:13.5px;color:var(--soft)}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-deep);margin:18px 0 8px}
input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:150px;resize:vertical;line-height:1.7}
.hint{font-size:12px;color:var(--soft);margin-top:6px}
.btn{display:block;width:100%;border:none;background:linear-gradient(135deg,#c9a15f,#8f6f3e);color:#fff;font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;padding:15px;border-radius:999px;cursor:pointer;margin-top:16px;box-shadow:0 10px 24px rgba(143,111,62,.3)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--gold-deep);border:1px solid var(--gold);box-shadow:none;margin-top:10px}
#out{margin-top:20px;display:none}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row .nm{flex:1;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .lnk{font-size:11px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%}
.copy{border:1px solid var(--gold);color:var(--gold-deep);background:#fff;border-radius:999px;padding:7px 14px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.copy:active{background:var(--gold);color:#fff}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#2b2520;color:#fff;font-size:13px;padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:all .3s;z-index:10}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;margin-top:34px;font-size:12px;color:var(--soft)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Undangen · Internal</div>
    <h1>Generator Link Tamu</h1>
    <p class="sub">Tempel daftar nama tamu → jadi link undangan personal <code>?to=Nama</code> siap kirim via WhatsApp.</p>
  </header>

  <label for="base">Link dasar undangan</label>
  <input type="text" id="base" value="https://undangen.my.id/tema/modern-elegan/">

  <label for="names">Daftar nama tamu <span style="font-weight:400;text-transform:none;letter-spacing:0">(satu nama per baris)</span></label>
  <textarea id="names" placeholder="Bpk. Hartono & Keluarga&#10;Ibu Sari&#10;Dinda & Fajar"></textarea>
  <p class="hint" id="count"></p>

  <button class="btn" id="gen">Buatkan Link</button>

  <div id="out"></div>
  <button class="btn ghost" id="copyAll" style="display:none">Salin Semua (format WhatsApp)</button>
</div>
<div id="toast"></div>
<footer>Dibuat dengan <b style="color:var(--gold-deep)">Undangen</b> by FinOwi Id</footer>

<script>
var $=function(id){return document.getElementById(id)};
var toastT;
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},2000)}
function copyText(v,msg){
  if(navigator.clipboard){navigator.clipboard.writeText(v).then(function(){toast(msg||'Tersalin')},function(){toast(v)})}
  else{toast(v)}
}
$('names').addEventListener('input',function(){
  var n=$('names').value.split('\n').map(function(s){return s.trim()}).filter(Boolean).length;
  $('count').textContent=n? n+' nama terdeteksi':'';
});
$('gen').addEventListener('click',function(){
  var base=$('base').value.trim().replace(/\/$/,'')+'/';
  var names=$('names').value.split('\n').map(function(s){return s.trim()}).filter(Boolean);
  if(!names.length){toast('Isi daftar nama dulu');return}
  var out=$('out');out.innerHTML='';out.style.display='block';
  var all=[];
  names.forEach(function(n){
    var link=base+'?to='+encodeURIComponent(n).replace(/%20/g,'+');
    all.push(n+'\n'+link);
    var r=document.createElement('div');r.className='row';
    var nm=document.createElement('div');nm.className='nm';nm.textContent=n;
    var b=document.createElement('button');b.className='copy';b.textContent='Salin';
    b.addEventListener('click',function(){copyText(link,'Link '+n+' tersalin')});
    r.appendChild(nm);r.appendChild(b);out.appendChild(r);
  });
  var ca=$('copyAll');ca.style.display='block';
  ca.onclick=function(){copyText(all.join('\n\n'),'Semua link tersalin ('+names.length+')')};
  toast(names.length+' link jadi');
});
</script>
</body>
</html>
